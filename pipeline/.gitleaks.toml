title = "Gitleaks configuration for the thesis pipeline"

[extend]
useDefault = true

[allowlist]
description = "Paths that are not application code"
paths = [
  '''^vendor/''',
  '''^node_modules/''',
  '''^tests/''',
  '''^storage/''',
  '''^reports/''',
  '''^public/build/''',
  '''composer\.lock$''',
  '''package-lock\.json$''',
]
